name: Build and test
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**.js'
      - 'package.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**.js'
      - 'package.json'
permissions:
  contents: write
  actions: read
  checks: write
jobs:
  test:
    if: |
      !contains(toJSON(github.event.commits.*.message), '[skip-ci]') &&
      !startsWith(github.ref, 'refs/tags')
    name: Generate build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0
      - run: npx esbuild ./src/blog-post-workflow.js --bundle --platform=node --format=esm --banner:js="import{createRequire}from'module';const require=createRequire(import.meta.url);" --outfile=dist/blog-post-workflow.js
      - name: Commit dist
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add dist/blog-post-workflow.js
          git diff --staged --quiet || git commit -m "build: update dist"
          git push
